        "500":
          application/json: {"code": "AUTH_INVALID_CREDENTIALS", "error": "Invalid email or password"}
        "404":
          application/json: {"code": "AUTH_INVALID_CREDENTIALS", "error": "Invalid email or password"}
  list_files:
